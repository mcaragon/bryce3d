name: Build image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/bryce3d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t bryce3d:ci .

      - name: Smoke test (fake CD whose SETUP.EXE is Wine's notepad)
        run: |
          set -eux
          sudo apt-get update -qq && sudo apt-get install -y -qq genisoimage
          mkdir -p cd storage
          np=$(docker run --rm --entrypoint sh bryce3d:ci -c 'find / -path "*i386-windows/notepad.exe" 2>/dev/null | head -1')
          docker run --rm --entrypoint cat bryce3d:ci "$np" > cd/SETUP.EXE
          genisoimage -quiet -V BRYCE3D -o storage/Bryce3DCD.iso cd
          mkdir -p storage/molecules && cp ci/molecules/caffeine.sdf storage/molecules/
          chmod -R a+rwX storage
          # seccomp=unconfined: Docker's default syscall filter breaks 32-bit Wine
          # ("wine: socket : Function not implemented").
          docker run -d --name b3d --security-opt seccomp=unconfined -p 5800:5800 -v "$PWD/storage:/storage" bryce3d:ci
          for i in $(seq 1 240); do
            docker logs b3d 2>&1 | grep -q "running installer" && break
            sleep 2
          done
          docker logs b3d 2>&1 | grep -v '^\[supervisor\|^\[xvnc' | tail -60
          docker exec b3d ps -eo pid,etime,args || true
          docker exec b3d sh -c 'DISPLAY=:0 xwininfo -root -tree | grep -v "has no name" | head -40' || true
          docker exec b3d sh -c 'cat /config/wineboot.log' || true
          docker logs b3d 2>&1 | grep -q "running installer"
          curl -fsS -o /dev/null http://localhost:5800/
          docker exec b3d sh -c 'cat /config/cdrom/.windows-label; ls -la /config/wine/dosdevices/'

          # VNC connection works through the click-fix proxy
          docker cp ci/rfb_check.py b3d:/tmp/rfb_check.py
          docker exec -u 1000 b3d python3 /tmp/rfb_check.py
          # Sharp scaling CSS installed
          # Sharp scaling is opt-in (SHARP_SCALING=1)
          ! docker exec b3d grep -q "bryce3d: sharp scaling" /opt/noVNC/app/styles/base.css || exit 1
          # Xvnc refuses browser resize requests, so the screen stays fixed
          docker exec b3d ps -eo args | grep Xvnc | grep -q -- "-AcceptSetDesktopSize=0"
          # Windows are no longer forced full-screen by the window manager
          sleep 5
          geo=$(docker exec b3d sh -c 'DISPLAY=:0 xdotool search --onlyvisible --name Notepad getwindowgeometry --shell %@' | tr '\n' ' ')
          echo "Notepad window: $geo"
          echo "$geo" | grep -q "WIDTH=" 
          if echo "$geo" | grep -q "WIDTH=1024 HEIGHT=768"; then echo "window was maximized by the WM"; exit 1; fi
          docker exec b3d sh -c 'reg=/config/wine/user.reg; grep -A2 "X11 Driver" $reg'
          # Molecule converter turned the dropped SDF into Bryce-ready models
          for i in $(seq 1 30); do [ -s storage/molecules/caffeine-ballstick.3ds ] && break; sleep 2; done
          docker logs b3d 2>&1 | grep "molwatch" | tail -5 || true
          ls -la storage/molecules
          for f in caffeine-spacefill.3ds caffeine-spacefill.obj caffeine-spacefill.mtl \
                   caffeine-ballstick.3ds caffeine-ballstick.obj caffeine-ballstick.mtl; do
            if [ ! -s "storage/molecules/$f" ]; then echo "molecule converter did not produce $f"; exit 1; fi
          done
          docker exec b3d sdf2bryce --help | head -3

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag bryce3d:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"
